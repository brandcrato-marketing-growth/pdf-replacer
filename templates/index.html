<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Custom PDF Text Overwrite Editor</title>
    <style>
        body { font-family: sans-serif; display: flex; margin: 0; background: #f4f5f7; }
        #sidebar { width: 350px; background: #fff; padding: 20px; border-right: 1px solid #ccc; height: 100vh; overflow-y: auto; }
        #canvas-container { flex-grow: 1; padding: 20px; position: relative; overflow: auto; }
        .text-block-input { width: 100%; margin-bottom: 10px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .editor-overlay-input { position: absolute; background: rgba(255, 255, 255, 0.9); border: 1px solid #007bff; font-family: inherit; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>পিডিএফ টেক্সট এডিটর</h2>
    <input type="file" id="pdf-upload" accept="application/pdf,image/*">
    <hr>
    <h3>ডিটেক্ট করা টেক্সটসমূহ:</h3>
    <div id="text-list"></div>
</div>

<div id="canvas-container">
    <div id="page-wrapper" style="position: relative;"></div>
</div>

<script>
document.getElementById('pdf-upload').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    const formData = new FormData();
    formData.append('file', file);

    const response = await fetch('/process-pdf', { method: 'POST', body: formData });
    const data = await response.json();
    
    const textList = document.getElementById('text-list');
    const wrapper = document.getElementById('page-wrapper');
    textList.innerHTML = '';
    wrapper.innerHTML = '';

    data.blocks.forEach((block, index) => {
        // সাইডবারে ইনপুট ফিল্ড তৈরি
        const input = document.createElement('input');
        input.className = 'text-block-input';
        input.value = block.text.trim();
        textList.appendChild(input);

        // ক্যানভাসে পজিশন অনুযায়ী সরাসরি এডিটেবল ইনপুট বসানো
        const overlay = document.createElement('textarea');
        overlay.className = 'editor-overlay-input';
        overlay.style.left = block.x + 'px';
        overlay.style.top = block.y + 'px';
        overlay.style.width = Math.max(block.w, 100) + 'px';
        overlay.style.height = Math.max(block.h, 30) + 'px';
        overlay.value = block.text.trim();

        input.addEventListener('input', (ev) => { overlay.value = ev.target.value; });
        overlay.addEventListener('input', (ev) => { input.value = ev.target.value; });

        wrapper.appendChild(overlay);
    });
});
</script>

</body>
</html>
